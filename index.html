<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase + ChatGPT 데이터 관리</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    /* 입력창 구조: 질문 입력 칸을 넓히기 위해 1fr auto로 변경 */
    .form-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 22px;
    }

    input {
      height: 46px;
      padding: 0 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .add-btn {
      background: #42a5f5;
      color: white;
    }

    .refresh-btn {
      background: #66bb6a;
      color: white;
      margin-bottom: 16px;
    }

    .edit-btn {
      background: #ffca28;
      color: #333;
    }

    .delete-btn {
      background: #ef5350;
      color: white;
    }

    .save-btn {
      background: #7e57c2;
      color: white;
    }

    .cancel-btn {
      background: #b0bec5;
      color: white;
    }

    .status {
      min-height: 24px;
      margin-bottom: 14px;
      color: #555;
      font-size: 14px;
      font-weight: bold;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .item-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: bold;
      color: #1e88e5;
    }

    .item-content {
      margin: 0;
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #eef2f5;
    }

    .item-date {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .edit-box {
      display: grid;
      grid-template-columns: 1fr 2fr auto auto;
      gap: 8px;
      width: 100%;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
      background: #f7f9fb;
      border-radius: 16px;
    }

    @media (max-width: 700px) {
      .form-box,
      .item,
      .edit-box {
        grid-template-columns: 1fr;
      }

      .item-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Firebase + ChatGPT 데이터 관리</h1>
    <div class="subtitle">질문을 던지면 ChatGPT가 답변하고, 그 결과를 Firebase Realtime Database에 저장합니다.</div>

    <div class="form-box">
      <input id="titleInput" type="text" placeholder="ChatGPT에게 던질 질문이나 첨삭할 문장을 입력하세요..." />
      <button class="add-btn" id="addBtn" onclick="addData()">AI 답변 생성 및 저장</button>
    </div>

    <button class="refresh-btn" onclick="loadData()">데이터 새로고침</button>
    <div id="status" class="status"></div>
    <div id="dataList" class="list"></div>
  </div>

  <script>
    // 1. Firebase Realtime Database URL
    const DATABASE_URL = 'https://kang-f4e85-default-rtdb.firebaseio.com';
    const DATA_PATH = 'items';

    // 2. Google Apps Script Web App URL (ChatGPT 연동용)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTmD_aKFktnu5BcmOj0x84D15A5qOEkAbpoyJ7DEGzJR7UayIGwKLDL7nFhU3hbB_wVw/exec';

    const titleInput = document.getElementById('titleInput');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');
    const addBtn = document.getElementById('addBtn');

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function getEndpoint(path = '') {
      const cleanPath = path ? `/${path}` : '';
      return `${DATABASE_URL}/${DATA_PATH}${cleanPath}.json`;
    }

    // [Read] Firebase에서 전체 기록 불러오기
    async function loadData() {
      try {
        setStatus('🔄 Firebase에서 데이터를 불러오는 중...');

        const response = await fetch(getEndpoint());
        const data = await response.json();

        renderData(data);
        setStatus('✅ 최신 데이터를 불러왔습니다.');
      } catch (error) {
        console.error(error);
        setStatus('❌ 데이터 불러오기 실패. Firebase Rule 설정을 확인하세요.');
      }
    }

    // [Create] ChatGPT 답변을 생성하고, 완성되면 Firebase에 동시 저장
    async function addData() {
      const question = titleInput.value.trim();

      if (!question) {
        alert('질문을 입력해주세요.');
        return;
      }

      try {
        // UI 비활성화 및 상태 표시
        addBtn.disabled = true;
        addBtn.textContent = '생성 중...';
        setStatus('🧠 1단계: Apps Script를 통해 ChatGPT 답변을 생성하고 있습니다...');

        // 1. ChatGPT API 호출 (Apps Script 경유)
        const aiResponse = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: question })
        });
        const aiData = await aiResponse.json();

        if (aiData.error) {
          throw new Error(aiData.error);
        }

        const gptAnswer = aiData.answer || '답변을 가져오지 못했습니다.';

        // 2. Firebase에 저장할 데이터 패키징
        setStatus('💾 2단계: 생성된 답변을 Firebase Database에 저장하는 중...');
        const newItem = {
          title: `질문: ${question}`,   // 제목 칸에 질문 배치
          content: gptAnswer,          // 내용 칸에 ChatGPT 답변 배치
          createdAt: new Date().toLocaleString('ko-KR')
        };

        // 3. Firebase REST API로 전송 (POST)
        await fetch(getEndpoint(), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(newItem)
        });

        // 완료 후 입력창 리셋 및 리스트 갱신
        titleInput.value = '';
        await loadData();
      } catch (error) {
        console.error(error);
        setStatus('❌ 작업 중 오류가 발생했습니다: ' + error.message);
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = 'AI 답변 생성 및 저장';
      }
    }

    // [Delete] Firebase에서 데이터 삭제
    async function deleteData(id) {
      const isConfirmed = confirm('이 데이터 기록을 Firebase에서 정말 삭제하시겠습니까?');
      if (!isConfirmed) return;

      try {
        setStatus('🗑️ Firebase에서 데이터를 삭제하는 중...');

        await fetch(getEndpoint(id), {
          method: 'DELETE'
        });

        await loadData();
      } catch (error) {
        console.error(error);
        setStatus('❌ 데이터 삭제에 실패했습니다.');
      }
    }

    // [Update] Firebase 데이터 수정 반영
    async function updateData(id) {
      const editTitle = document.getElementById(`edit-title-${id}`).value.trim();
      const editContent = document.getElementById(`edit-content-${id}`).value.trim();

      if (!editTitle || !editContent) {
        alert('수정할 제목과 내용을 모두 입력해주세요.');
        return;
      }

      const updatedItem = {
        title: editTitle,
        content: editContent,
        updatedAt: new Date().toLocaleString('ko-KR')
      };

      try {
        setStatus('📝 Firebase 데이터를 수정하는 중...');

        await fetch(getEndpoint(id), {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(updatedItem)
        });

        await loadData();
      } catch (error) {
        console.error(error);
        setStatus('❌ 데이터 수정에 실패했습니다.');
      }
    }

    // 화면에 Firebase 데이터 뿌려주기
    function renderData(data) {
      dataList.innerHTML = '';

      if (!data) {
        dataList.innerHTML = '<div class="empty">아직 저장된 질문/답변 기록이 없습니다.</div>';
        return;
      }

      const entries = Object.entries(data).reverse();

      entries.forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `item-${id}`;

        div.innerHTML = `
          <div>
            <p class="item-title">${escapeHTML(item.title || '')}</p>
            <p class="item-content">${escapeHTML(item.content || '')}</p>
            <div class="item-date">
              등록: ${item.createdAt || '-'}
              ${item.updatedAt ? ` / 수정: ${item.updatedAt}` : ''}
            </div>
          </div>
          <div class="item-actions">
            <button class="edit-btn" onclick="showEditForm('${id}', '${escapeForAttribute(item.title || '')}', '${escapeForAttribute(item.content || '')}')">수정</button>
            <button class="delete-btn" onclick="deleteData('${id}')">삭제</button>
          </div>
        `;

        dataList.appendChild(div);
      });
    }

    function showEditForm(id, title, content) {
      const itemBox = document.getElementById(`item-${id}`);

      itemBox.innerHTML = `
        <div class="edit-box">
          <input id="edit-title-${id}" type="text" value="${title}" />
          <input id="edit-content-${id}" type="text" value="${content}" />
          <button class="save-btn" onclick="updateData('${id}')">저장</button>
          <button class="cancel-btn" onclick="loadData()">취소</button>
        </div>
      `;
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeForAttribute(text) {
      return escapeHTML(text).replaceAll('`', '&#096;');
    }

    // Enter 키로 데이터 추가 활성화
    titleInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        addData();
      }
    });

    // 앱 로드 시 자동 실행
    loadData();
  </script>
</body>
</html>
