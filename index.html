<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase 로그인 & ChatGPT 관리</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .auth-box {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input {
      height: 46px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    input:focus, textarea:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; }
    .add-btn { background: #42a5f5; color: white; }
    .refresh-btn { background: #66bb6a; color: white; margin-bottom: 16px; }
    .edit-btn { background: #ffca28; color: #333; }
    .delete-btn { background: #ef5350; color: white; }
    .save-btn { background: #7e57c2; color: white; }
    .cancel-btn { background: #b0bec5; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .ask-btn { background: #26a69a; color: white; }

    .form-box {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 10px;
      margin-bottom: 22px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 16px;
      background: #f7f9fb;
    }

    .user-info {
      font-size: 14px;
      color: #555;
      word-break: break-all;
    }

    .status {
      min-height: 24px;
      margin-bottom: 14px;
      color: #555;
      font-size: 14px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .item-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: bold;
    }

    .item-content {
      margin: 0;
      color: #555;
      line-height: 1.5;
      word-break: break-all;
    }

    .item-date {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .edit-box {
      display: grid;
      grid-template-columns: 1fr 2fr auto auto;
      gap: 8px;
      width: 100%;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
      background: #f7f9fb;
      border-radius: 16px;
    }

    .hidden {
      display: none;
    }

    .notice {
      max-width: 620px;
      margin: 20px auto 0;
      padding: 14px;
      border-radius: 14px;
      background: #fff8e1;
      color: #6d4c41;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ChatGPT 섹션 스타일 추가 */
    .chat-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed #e0e0e0;
    }
    .answer-box {
      min-height: 150px;
      padding: 18px;
      border-radius: 18px;
      background: #f1f8e9;
      border: 1px solid #dcedc8;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
    }
    .button-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin: 10px 0;
    }
    .label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    @media (max-width: 700px) {
      .form-box, .item, .edit-box, .top-bar, .button-row {
        grid-template-columns: 1fr;
        flex-direction: column;
        align-items: stretch;
      }
      .item-actions {
        justify-content: flex-end;
      }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Firebase & ChatGPT 통합 시스템</h1>
    <div class="subtitle">Authentication + Realtime DB + Google Apps Script 연동</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일" />
        <input id="passwordInput" type="password" placeholder="비밀번호 6자리 이상" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>

      <div class="notice">
        처음 사용하는 이메일은 회원가입을 먼저 누르세요.<br />
        이미 가입한 이메일은 로그인 버튼을 누르면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">
          로그인 계정: <strong id="userEmail"></strong>
        </div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <h2>📄 나만의 실시간 메모장 (Firebase)</h2>
      <div class="form-box">
        <input id="titleInput" type="text" placeholder="제목 입력" />
        <input id="contentInput" type="text" placeholder="내용 입력" />
        <button class="add-btn" id="addBtn">추가</button>
      </div>

      <button class="refresh-btn" id="refreshBtn">데이터 새로고침</button>
      <div id="status" class="status"></div>
      <div id="dataList" class="list"></div>

      <div class="chat-section">
        <h2>🤖 ChatGPT AI 어시스턴트 (Spreadsheet 연동)</h2>
        <div>
          <div class="label">질문 입력</div>
          <textarea id="questionInput" placeholder="ChatGPT에게 궁금한 점을 질문해보세요! (예: 구글 앱스 스크립트 장점이 뭐야?)"></textarea>
        </div>

        <div class="button-row">
          <button class="clear-btn" id="clearBtn">초기화</button>
          <button class="ask-btn" id="askBtn">ChatGPT에게 질문하기</button>
        </div>

        <div>
          <div class="label">AI 답변 결과</div>
          <div id="answerBox" class="answer-box">아직 질문이 없습니다. 답변 내용은 구글 스프레드시트에도 자동 저장됩니다.</div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // 네 프로젝트 정보 고정
    const firebaseConfig = {
      apiKey: "AIzaSyA_3R0IqaFBLLLstnQ7kZQAiPsZRR2GIEM",
      authDomain: "goldmoislayer.firebaseapp.com",
      databaseURL: "https://goldmoislayer-default-rtdb.firebaseio.com",
      projectId: "goldmoislayer",
      storageBucket: "goldmoislayer.firebasestorage.app",
      messagingSenderId: "637343880273",
      appId: "1:637343880273:web:0383ca3e92a860ca739470",
      measurementId: "G-5W6B3EGXCX"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    // 🟢 여기에 네 구글 주소가 완벽하게 들어가 있어!
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzn9di13ViePS6BxZU_CEOVw6aZBu8ZYJR_YTYMCvcDbdjX6jN6elptTkAlHXtdI0_4/exec';

    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');
    const addBtn = document.getElementById('addBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    const questionInput = document.getElementById('questionInput');
    const answerBox = document.getElementById('answerBox');
    const askBtn = document.getElementById('askBtn');
    const clearBtn = document.getElementById('clearBtn');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function getEmailAndPassword() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) { alert('이메일과 비밀번호를 모두 입력해주세요.'); return null; }
      if (password.length < 6) { alert('비밀번호는 6자리 이상이어야 합니다.'); return null; }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try {
        await auth.createUserWithEmailAndPassword(account.email, account.password);
        alert('회원가입이 완료되었습니다.');
      } catch (error) { alert(getKoreanErrorMessage(error.code)); }
    });

    loginBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try { await auth.signInWithEmailAndPassword(account.email, account.password); } 
      catch (error) { alert(getKoreanErrorMessage(error.code)); }
    });

    logoutBtn.addEventListener('click', async () => {
      try { await auth.signOut(); } catch (error) { alert('로그아웃에 실패했습니다.'); }
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        showMainPage(user);
        startRealtimeDataListener(user.uid);
      } else {
        currentUser = null;
        showAuthPage();
        stopRealtimeDataListener();
      }
    });

    function showMainPage(user) {
      authSection.classList.add('hidden');
      mainSection.classList.remove('hidden');
      userEmail.textContent = user.email;
      emailInput.value = '';
      passwordInput.value = '';
    }

    function showAuthPage() {
      authSection.classList.remove('hidden');
      mainSection.classList.add('hidden');
      userEmail.textContent = '';
      dataList.innerHTML = '';
      clearPage();
    }

    function startRealtimeDataListener(uid) {
      stopRealtimeDataListener();
      setStatus('데이터를 불러오는 중입니다...');
      currentItemsRef = database.ref(`users/${uid}/items`);
      currentItemsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        renderData(data);
        setStatus('데이터가 실시간으로 동기화되었습니다.');
      }, (error) => {
        console.error(error);
        setStatus('데이터 에러. 보안 규칙을 확인하세요.');
      });
    }

    function stopRealtimeDataListener() {
      if (currentItemsRef) { currentItemsRef.off(); currentItemsRef = null; }
    }

    addBtn.addEventListener('click', addData);
    refreshBtn.addEventListener('click', () => { if (currentUser) startRealtimeDataListener(currentUser.uid); });

    async function addData() {
      if (!currentUser) { alert('로그인이 필요합니다.'); return; }
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title || !content) { alert('제목과 내용을 모두 입력해주세요.'); return; }
      try {
        const itemsRef = database.ref(`users/${currentUser.uid}/items`);
        await itemsRef.push().set({
          title, content,
          createdAt: new Date().toLocaleString('ko-KR'),
          updatedAt: ''
        });
        titleInput.value = ''; contentInput.value = '';
      } catch (error) { alert('데이터 추가 실패'); }
    }

    askBtn.addEventListener('click', askChatGPT);
    clearBtn.addEventListener('click', clearPage);

    async function askChatGPT() {
      const question = questionInput.value.trim();
      if (!question) { alert('질문을 입력해주세요.'); return; }

      try {
        setLoading(true);
        answerBox.textContent = '답변을 생성하는 중입니다...';
        setStatus('Apps Script 서버에 요청을 보냈습니다.');

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: question })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        answerBox.textContent = data.answer || '답변을 가져오지 못했습니다.';
        setStatus('답변 생성 완료 및 스프레드시트 기록 완료');
      } catch (error) {
        console.error(error);
        answerBox.textContent = '오류가 발생했습니다.\n\n' + error.message;
        setStatus('요청 실패');
      } finally {
        setLoading(false);
      }
    }

    function setLoading(isLoading) {
      askBtn.disabled = isLoading;
      askBtn.textContent = isLoading ? '생성 중...' : 'ChatGPT에게 질문하기';
    }

    function clearPage() {
      questionInput.value = '';
      answerBox.textContent = '아직 질문이 없습니다. 답변 내용은 구글 스프레드시트에도 자동 저장됩니다.';
    }

    window.deleteData = async function(id) {
      if (!currentUser || !confirm('정말 삭제하시겠습니까?')) return;
      try { await database.ref(`users/${currentUser.uid}/items/${id}`).remove(); } catch (error) { alert('삭제 실패'); }
    };

    window.updateData = async function(id) {
      if (!currentUser) return;
      const editTitle = document.getElementById(`edit-title-${id}`).value.trim();
      const editContent = document.getElementById(`edit-content-${id}`).value.trim();
      if (!editTitle || !editContent) { alert('내용을 채워주세요.'); return; }
      try {
        await database.ref(`users/${currentUser.uid}/items/${id}`).update({
          title: editTitle, content: editContent, updatedAt: new Date().toLocaleString('ko-KR')
        });
      } catch (error) { alert('수정 실패'); }
    };

    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) { dataList.innerHTML = '<div class="empty">아직 저장된 데이터가 없습니다.</div>'; return; }
      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item'; div.id = `item-${id}`;
        div.innerHTML = `
          <div>
            <p class="item-title">${escapeHTML(item.title || '')}</p>
            <p class="item-content">${escapeHTML(item.content || '')}</p>
            <div class="item-date">생성: ${item.createdAt || '-'} ${item.updatedAt ? ` / 수정: ${item.updatedAt}` : ''}</div>
          </div>
          <div class="item-actions">
            <button class="edit-btn" onclick="showEditForm('${id}', '${escapeForAttribute(item.title || '')}', '${escapeForAttribute(item.content || '')}')">수정</button>
            <button class="delete-btn" onclick="deleteData('${id}')">삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    window.showEditForm = function(id, title, content) {
      document.getElementById(`item-${id}`).innerHTML = `
        <div class="edit-box">
          <input id="edit-title-${id}" type="text" value="${title}" />
          <input id="edit-content-${id}" type="text" value="${content}" />
          <button class="save-btn" onclick="updateData('${id}')">저장</button>
          <button class="cancel-btn" onclick="startRealtimeDataListener(currentUser.uid)">취소</button>
        </div>
      `;
    };

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function escapeForAttribute(text) { return escapeHTML(text).replaceAll('`', '&#096;'); }

    function getKoreanErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use': return '이미 가입된 이메일입니다.';
        case 'auth/invalid-email': return '이메일 형식이 올바르지 않습니다.';
        case 'auth/weak-password': return '비밀번호는 6자리 이상으로 입력해주세요.';
        case 'auth/user-not-found': case 'auth/wrong-password': case 'auth/invalid-credential': return '이메일 또는 비밀번호가 올바르지 않습니다.';
        default: return `오류가 발생했습니다: ${code}`;
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Enter') return;
      const activeId = document.activeElement.id;
      if (activeId === 'emailInput' || activeId === 'passwordInput') loginBtn.click();
      if (activeId === 'titleInput' || activeId === 'contentInput') addBtn.click();
    });
  </script>
</body>
</html>
