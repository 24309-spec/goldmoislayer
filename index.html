<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase 로그인 & ChatGPT 관리</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .auth-box {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input {
      height: 46px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    input:focus, textarea:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; }
    .add-btn { background: #42a5f5; color: white; }
    .refresh-btn { background: #66bb6a; color: white; margin-bottom: 16px; }
    .edit-btn { background: #ffca28; color: #333; }
    .delete-btn { background: #ef5350; color: white; }
    .save-btn { background: #7e57c2; color: white; }
    .cancel-btn { background: #b0bec5; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .ask-btn { background: #26a69a; color: white; }

    .form-box {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 10px;
      margin-bottom: 22px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 16px;
      background: #f7f9fb;
    }

    .user-info {
      font-size: 14px;
      color: #555;
      word-break: break-all;
    }

    .status {
      min-height: 24px;
      margin-bottom: 14px;
      color: #555;
      font-size: 14px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .item-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: bold;
    }

    .item-content {
      margin: 0;
      color: #555;
      line-height: 1.5;
      word-break: break-all;
    }

    .item-date {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .edit-box {
      display: grid;
      grid-template-columns: 1fr 2fr auto auto;
      gap: 8px;
      width: 100%;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
      background: #f7f9fb;
      border-radius: 16px;
    }

    .hidden {
      display: none;
    }

    .notice {
      max-width: 620px;
      margin: 20px auto 0;
      padding: 14px;
      border-radius: 14px;
      background: #fff8e1;
      color: #6d4c41;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ChatGPT 섹션 스타일 추가 */
    .chat-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed #e0e0e0;
    }
    .answer-box {
      min-height: 150px;
      padding: 18px;
      border-radius: 18px;
      background: #f1f8e9;
      border: 1px solid #dcedc8;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
    }
    .button-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin: 10px 0;
    }
    .label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    @media (max-width: 700px) {
      .form-box, .item, .edit-box, .top-bar, .button-row {
        grid-template-columns: 1fr;
        flex-direction: column;
        align-items: stretch;
      }
      .item-actions {
        justify-content
